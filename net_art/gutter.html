<!-- 3. The JavaScript Logic -->
  <script>
    // List of URLs to cycle through
    const pages = [
      "downlane.html",
      "gutter.html",
      
    ];

    const clicksRequired = 3; // Change pages every 3 clicks
    let clickCount = 0;
    let pageIndex = 0;

    // Grab the <area> element instead of an <a> element
    const areaElement = document.getElementById("rotatingArea");

    areaElement.addEventListener("click", function(event) {
      clickCount++;

      // When threshold is met, swap the destination URL
      if (clickCount >= clicksRequired) {
        clickCount = 0; // Reset counter
        pageIndex = (pageIndex + 1) % pages.length; // Advance index (and loop back to 0 at the end)
        areaElement.href = pages[pageIndex]; // Update the map area target
      }
    });
  </script>
