    let currentClicks = parseInt(localStorage.getItem('mapClickCount')) || 0;

    // Determine which link to use based on the current click count
    // using the remainder operator (%) so it cycles back if it goes past 3 clicks
    let linkIndex = currentClicks % linksSequence.length;
    let targetLink = linksSequence[linkIndex];

    // Increment the click count and save it back to the browser's memory
    currentClicks++;
    localStorage.setItem('mapClickCount', currentClicks);

    // Redirect the browser to the assigned link
